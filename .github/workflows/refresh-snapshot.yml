name: Refresh demo snapshot

on:
  schedule:
    # Понедельник 00:00 по Москве (UTC+3) = воскресенье 21:00 UTC
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write   # коммит снимка в main
  actions: write    # запуск деплоя Pages (push от GITHUB_TOKEN другие workflow не запускает)

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    # Снимок публикуется только из main (оттуда же деплоится Pages)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Временная БД: на каждом запуске собираем данные с нуля
      DATABASE_URL: sqlite:///./snapshot.db
      LOG_DIR: ./logs
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Бережный режим парсера (задержки 1–3 с, ≤2 параллельных запроса) берётся из конфига по умолчанию
      - name: Full parse into a temporary SQLite
        working-directory: backend
        run: python cli.py parse --force

      - name: Export snapshot
        working-directory: backend
        run: python cli.py export-snapshot --output ../frontend/data/snapshot.json

      - name: Sanity check and write meta.json
        run: |
          python - <<'PY'
          import json, sys
          snap = json.load(open("frontend/data/snapshot.json", encoding="utf-8"))
          count = len(snap["vacancies"])
          if count < 300:
              sys.exit(f"Слишком мало вакансий в снимке ({count}); публикацию отменяем")
          meta = {"updated": snap["generated_at"][:10], "generated_at": snap["generated_at"], "vacancies": count}
          json.dump(meta, open("frontend/data/meta.json", "w", encoding="utf-8"), ensure_ascii=False)
          print(meta)
          PY

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data/snapshot.json frontend/data/meta.json
          if git diff --cached --quiet; then
            echo "Снимок не изменился, коммит не нужен"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Обновлён снимок данных Habr Career"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Коммит от GITHUB_TOKEN не запускает pages.yml по push, поэтому деплой вызываем явно
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
